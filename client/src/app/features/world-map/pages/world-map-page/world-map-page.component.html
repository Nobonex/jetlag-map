<nz-layout class="app-shell">
  <nz-header #appHeader class="app-header">
    <div class="header-primary">
      <div class="brand-lockup">
        <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true" />
        <div class="brand-copy">
          <span class="app-brand">JetLag</span>
          <span class="brand-subtitle">Field map</span>
        </div>
      </div>
      <button type="button" class="share-button" nz-button nzShape="round" (click)="shareState()">
        {{ $shareButtonLabel() }}
      </button>
      <button
        type="button"
        class="header-sidebar-toggle"
        nz-button
        nzShape="round"
        nzSize="small"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="$isSidebarExpanded()"
        aria-controls="question-sidebar-content"
      >
        {{ $isSidebarExpanded() ? 'Hide questions' : 'Show questions' }}
      </button>
    </div>

    <label class="selector-block">
      <span class="selector-label">Game area</span>
      <nz-select
        class="country-select"
        [ngModel]="$selectedCountryCode()"
        (ngModelChange)="onSelectedCountryChange($event)"
        [nzAllowClear]="true"
        [nzDisabled]="$isLoadingCountries()"
        [nzLoading]="$isLoadingCountries()"
        [nzShowSearch]="true"
        nzPlaceHolder="Select a country"
      >
        @for (country of $countryOptions(); track country.code) {
          <nz-option [nzLabel]="country.name" [nzValue]="country.code"></nz-option>
        }
      </nz-select>
    </label>
  </nz-header>

  <main class="workspace-shell">
    <aside
      #questionSidebar
      class="question-sidebar"
      [class.is-collapsed]="!$isSidebarExpanded()"
      [class.is-dragging]="$isSheetDragging()"
      [style.transform]="$sheetDragTransform()"
      [attr.tabindex]="$isSidebarExpanded() ? 0 : -1"
      aria-label="JetLag questions sidebar"
    >
      <button
        type="button"
        class="mobile-sheet-toggle"
        (click)="onSheetToggle()"
        (pointerdown)="onSheetPointerDown($event)"
        (pointermove)="onSheetPointerMove($event)"
        (pointerup)="onSheetPointerUp()"
        (pointercancel)="onSheetPointerUp()"
        [attr.aria-expanded]="$isSidebarExpanded()"
        aria-controls="question-sidebar-content"
      >
        <span class="sheet-grip" aria-hidden="true"></span>
        <span>Questions</span>
        <span class="sheet-count">{{ $questions().length }}</span>
      </button>
      <div
        id="question-sidebar-content"
        class="sidebar-content"
        [attr.aria-hidden]="!$isSidebarExpanded()"
      >
        <app-questions-sidebar [questions]="$questions()" />
      </div>
    </aside>

    <section class="map-shell">
      <div
        #mapContainer
        class="map-container"
        aria-label="World map"
        (contextmenu)="onMapContextMenu($event)"
        (click)="onMapClick($event)"
        (pointerdown)="onMapPointerDown($event)"
        (pointermove)="onMapPointerMove($event)"
        (pointerup)="onMapPointerUp($event)"
        (pointercancel)="onMapPointerUp($event)"
        (pointerleave)="onMapPointerUp($event)"
      ></div>

      <div class="map-actions">
        <button
          type="button"
          class="add-question-trigger"
          nz-button
          (click)="openQuestionPicker()"
        >
          <span class="add-question-plus" aria-hidden="true">+</span>
          Add <span class="add-question-long-label">question</span>
        </button>

        <button
          type="button"
          class="map-options-trigger"
          nz-button
          nzShape="round"
          nz-dropdown
          [nzDropdownMenu]="optionsMenu"
          nzPlacement="topLeft"
        >
          <span class="options-label-desktop">Options</span>
          <span class="options-label-mobile">Menu</span>
        </button>
      </div>

      @if ($drawingAreaQuestionId()) {
        <div class="drawing-banner" role="status" aria-live="polite">
          <div>
            <span class="drawing-kicker">Survey in progress</span>
            <strong>{{ $drawingAreaPointCount() }} points placed</strong>
          </div>
          <span class="drawing-hint">Tap the map to add points, or point 1 to close.</span>
          <div class="drawing-actions">
            <button type="button" nz-button nzSize="small" (click)="cancelAreaDrawing()">
              Cancel
            </button>
            <button
              type="button"
              nz-button
              nzType="primary"
              nzSize="small"
              [disabled]="$drawingAreaPointCount() < 3"
              (click)="finishAreaDrawing()"
            >
              Finish area
            </button>
          </div>
        </div>
      }

      <nz-dropdown-menu #optionsMenu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item [nzDisabled]="!isLocationSupported" (click)="toggleUserLocation()">
            {{ $locationMenuLabel() }}
          </li>
          <li nz-menu-item [nzDisabled]="!$canClearSavedData()" (click)="confirmClearQuestions()">
            Clear saved data
          </li>
        </ul>
      </nz-dropdown-menu>

      @if ($contextMenuPosition(); as menuPosition) {
        <button
          type="button"
          class="map-context-menu-backdrop"
          aria-label="Close map context menu"
          (click)="closeContextMenu()"
        ></button>

        <nz-card
          #contextMenu
          class="map-context-menu"
          nzSize="small"
          [style.left.px]="menuPosition.x"
          [style.top.px]="menuPosition.y"
          role="menu"
          aria-label="Map context menu"
        >
          <div class="question-picker-heading">
            <span class="question-picker-kicker">New field note</span>
            <strong>Choose a question</strong>
          </div>
          <button
            type="button"
            class="map-context-menu-action"
            nz-button
            nzType="text"
            (click)="addRadarQuestion()"
          >
            <span class="picker-icon" aria-hidden="true">R</span>
            <span><strong>Radar</strong><small>Measure a radius</small></span>
          </button>
          <button
            type="button"
            class="map-context-menu-action"
            nz-button
            nzType="text"
            (click)="addThermometerQuestion()"
          >
            <span class="picker-icon" aria-hidden="true">T</span>
            <span><strong>Thermometer</strong><small>Choose warmer or colder</small></span>
          </button>
          <button
            type="button"
            class="map-context-menu-action"
            nz-button
            nzType="text"
            [disabled]="$drawingAreaQuestionId() !== null"
            (click)="addAreaQuestion()"
          >
            <span class="picker-icon" aria-hidden="true">A</span>
            <span>
              <strong>{{ $drawingAreaQuestionId() ? 'Area in progress' : 'Draw area' }}</strong>
              <small>Mark a custom boundary</small>
            </span>
          </button>
        </nz-card>
      }
    </section>
  </main>
</nz-layout>
