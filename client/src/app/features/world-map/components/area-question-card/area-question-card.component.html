<app-question-card
  [question]="question"
  [index]="index"
  typeLabel="Area"
  (toggleCollapsed)="onToggleCollapsed($event)"
  (toggleLocked)="onToggleLocked($event)"
  (deleteRequest)="onDeleteRequest($event)"
  (titleChange)="onTitleChange($event)"
>
  @if (!question.isClosed) {
    <p class="area-drawing-note">
      Drawing: click the map to add points. After adding at least three, click point 1 to close
      the area.
    </p>
    <span class="area-point-count">{{ question.vertices.length }} points placed</span>
  } @else {
    <div class="question-field">
      <span class="question-field-label">Answer</span>
      <nz-radio-group
        [ngModel]="question.applied.mode"
        (ngModelChange)="onModeChange($event)"
        [nzDisabled]="question.isLocked"
      >
        <label nz-radio-button nzValue="inside">Inside</label>
        <label nz-radio-button nzValue="outside">Outside</label>
      </nz-radio-group>
    </div>
  }

  @if (question.isLocked) {
    <p class="question-lock-note">Locked: the answer and vertex markers cannot be changed.</p>
  }
</app-question-card>
